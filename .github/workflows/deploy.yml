name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (compile check only)
        run: ./gradlew compileJava

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/duoinfra-backend
            git pull origin main
            chmod +x gradlew
            ./gradlew bootJar
            sudo systemctl restart duoinfra-backend

      - name: Notify Discord on success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "✅ 배포 성공 - ${{ github.repository }} (${{ github.sha }})"}' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "❌ 배포 실패 - ${{ github.repository }} (${{ github.sha }})"}' \
          ${{ secrets.DISCORD_WEBHOOK }}
