services:
  mysql:
    image: mysql:8.0
    container_name: duoinfra-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-duoinfra}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: duoinfra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duoinfra-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PHYSICAL_SERVER_HOST: ${PHYSICAL_SERVER_HOST:-220.117.221.158}
      PHYSICAL_SERVER_PORT: ${PHYSICAL_SERVER_PORT:-22}
      PHYSICAL_SERVER_USERNAME: ${PHYSICAL_SERVER_USERNAME:-pi}
      PHYSICAL_SERVER_PASSWORD: ${PHYSICAL_SERVER_PASSWORD}
      ADMIN_TEMP_EMAILS: ${ADMIN_TEMP_EMAILS:-}
    ports:
      - "8080:8080"

  # node_exporter: EC2 호스트 자체의 물리 메모리/디스크/CPU 지표 수집용.
  # 오늘 겪은 "디스크/메모리 부족" 사고는 앱(JVM) 지표만으로는 절대 보이지 않는다 —
  # JVM 힙이 넉넉해도 호스트 디스크가 꽉 차거나 스왑이 발생할 수 있기 때문에,
  # 컨테이너가 아니라 호스트 자체를 관찰하는 별도 exporter가 필요하다.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: duoinfra-node-exporter
    restart: unless-stopped
    # pid: host          → 호스트의 PID 네임스페이스를 그대로 사용한다.
    #                      컨테이너 자신의 PID 1개짜리 네임스페이스가 아니라
    #                      호스트에서 실제로 돌아가는 전체 프로세스를 봐야
    #                      프로세스/스레드 관련 지표가 정확해진다.
    # network_mode: host → 호스트의 네트워크 스택을 그대로 공유한다.
    #                      일반 컨테이너 네트워크(가상 eth0, 별도 IP)로는
    #                      호스트의 실제 네트워크 인터페이스 통계를 볼 수 없다.
    #                      (단, 이 옵션을 쓰면 docker-compose의 서비스명 DNS와
    #                       "networks:" 설정에는 더 이상 참여하지 못한다 — 아래 prometheus 설정 참고)
    pid: host
    network_mode: host
    volumes:
      # 호스트의 /proc, /sys, / 를 읽기 전용으로 마운트해 컨테이너가 아닌
      # "호스트"의 실제 시스템 정보를 읽도록 한다. 쓰기 권한은 전혀 필요 없으므로 ro로 고정.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      # 컨테이너 오버레이/가상 파일시스템까지 디스크 지표로 잡혀 노이즈가 되는 것을 방지
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|host/.+)($$|/)'
    # network_mode: host 인 컨테이너는 ports: 매핑 자체가 무시된다(호스트 인터페이스에 직접 바인딩됨).
    # 즉 "docker-compose에서 포트를 안 열었으니 안전하다"는 보장이 이 컨테이너에는 적용되지 않는다.
    # "외부 노출 금지, Prometheus만 접근 가능"은 아래 두 가지로 보장한다:
    #   1) EC2 보안 그룹에서 9100 포트를 인바운드로 절대 열지 않는다(기본값도 이미 차단).
    #   2) 같은 호스트 안의 Prometheus 컨테이너만 host-gateway를 통해 9100에 접근한다.

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: duoinfra-prometheus
    restart: unless-stopped
    depends_on:
      - app
    extra_hosts:
      # node-exporter가 network_mode: host라 docker-compose 서비스명(DNS)으로는 접근할 수 없다.
      # host-gateway는 "호스트 자신"을 가리키는 특수 주소이며, Docker 20.10+에서 지원한다.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # 호스트에 포트를 노출하지 않는다: Prometheus는 Grafana만 조회하면 되는 내부 컴포넌트라
    # 외부에서 직접 접근할 필요가 없고, 열어두면 그 자체로 불필요한 공격 표면이 된다.
    # Grafana는 같은 docker-compose 네트워크 안에서 "http://prometheus:9090"으로 접근한다.

  grafana:
    image: grafana/grafana:11.3.0
    container_name: duoinfra-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      # 대시보드를 직접 봐야 하므로 Grafana만 호스트에 노출한다.
      - "3000:3000"

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
