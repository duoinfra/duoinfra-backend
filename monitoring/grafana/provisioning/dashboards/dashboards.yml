# Grafana 기동 시 이 디렉토리(/etc/grafana/provisioning/dashboards)에 있는
# 대시보드 JSON 파일들을 자동으로 로드(import)하기 위한 provider 설정.
#
# 대시보드 JSON은 손으로 새로 작성하지 않고, Grafana 공식/커뮤니티 템플릿을
# grafana.com에서 그대로 받아 이 폴더에 두는 방식을 쓴다:
#   - jvm-micrometer.json      : "JVM (Micrometer)" 공식 템플릿 (Dashboard ID 4701)
#   - node-exporter-full.json  : "Node Exporter Full" 표준 템플릿 (Dashboard ID 1860)
apiVersion: 1

providers:
  - name: 'duoinfra-dashboards'
    orgId: 1
    folder: ''                # 별도 폴더 없이 General 폴더에 바로 노출
    type: file
    disableDeletion: false    # 이 폴더에서 JSON 파일이 사라지면 대시보드도 함께 삭제 (파일이 항상 source of truth)
    updateIntervalSeconds: 30 # 30초마다 이 폴더를 다시 스캔해 변경 사항 반영
    allowUiUpdates: true      # Grafana UI에서 패널을 조정해도 재시작/재스캔 때 덮어쓰지 않음
                              # (단, UI에서 바꾼 내용은 JSON 파일에 다시 저장되지 않으므로
                              #  영구 반영하려면 JSON 파일 자체를 수정해야 한다)
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
