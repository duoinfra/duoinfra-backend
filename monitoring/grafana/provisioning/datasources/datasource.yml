# Grafana 컨테이너가 기동될 때 이 파일을 읽어 Prometheus 데이터 소스를 자동으로 등록한다.
# (수동으로 "Add data source"를 클릭할 필요 없이 최초 실행부터 바로 대시보드 구성 가능)
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # docker-compose 내부 네트워크 DNS: 서비스명 prometheus, 기본 포트 9090
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # 로그 조회 전용 데이터소스. 메트릭(Prometheus)은 그대로 기본값으로 유지하고,
  # Loki는 로그 대시보드에서만 명시적으로 선택해 쓰도록 isDefault를 주지 않는다.
  - name: Loki
    type: loki
    access: proxy
    uid: loki   # 대시보드 JSON에서 datasource.uid로 고정 참조하기 위해 명시적으로 지정
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
