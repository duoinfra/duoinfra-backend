spring:
  datasource:
    url: jdbc:mysql://localhost:3306/duoinfra?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

physical-server:
  host: ${PHYSICAL_SERVER_HOST:220.117.221.158}
  port: ${PHYSICAL_SERVER_PORT:22}
  username: ${PHYSICAL_SERVER_USERNAME:pi}
  password: ${PHYSICAL_SERVER_PASSWORD}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
