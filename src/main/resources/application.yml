spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: jdbc:mysql://localhost:3306/duoinfra?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

physical-server:
  host: ${PHYSICAL_SERVER_HOST:220.117.221.158}
  port: ${PHYSICAL_SERVER_PORT:22}
  username: ${PHYSICAL_SERVER_USERNAME:pi}
  password: ${PHYSICAL_SERVER_PASSWORD}

jwt:
  secret: ${JWT_SECRET:local-development-only-jwt-secret-do-not-use-in-production}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}

# TODO(임시 조치): 정식 관리자 승격 API가 생기면 이 프로퍼티와 SignupService의 관련 로직을 제거할 것.
# 콤마로 구분된 이메일 목록으로, 여기 등록된 이메일로 회원가입하면 자동으로 ADMIN 권한이 부여된다.
admin:
  temp-emails: ${ADMIN_TEMP_EMAILS:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
